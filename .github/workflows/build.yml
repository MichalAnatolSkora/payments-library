name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ./Payment.slnx
      - name: Build
        run: dotnet build ./Payment.slnx --configuration Release --no-restore
      - name: Test
        # Integration tests skip themselves when appsettings.Testing.json is absent.
        run: dotnet test ./Payment.slnx --configuration Release --no-build
      - name: Pack
        run: |
          dotnet pack ./src/Payment.Models/Payment.Models.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack ./src/Payment.Core.P24/Payment.Core.P24.csproj --configuration Release --no-build --output ./artifacts
